[project]
name = "local-whisper-transcriber"
version = "0.1.0"
description = "Servicio local dockerizado para la transcripción ASR con faster-whisper"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "av>=12.0.0",
    "ctranslate2>=4.0.0",
    "streamlit>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"